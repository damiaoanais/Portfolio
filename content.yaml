# ============================================================

positioning:
  category: "Product Building"

  # Brouillon de proposition de valeur : à reformuler avec tes mots
  headline: "Je transforme des idées en produits digitaux avec l'IA et le no-code."

  short_description: >-
    Product Builder basée à Paris, je conçois, construis et teste
    des produits digitaux en combinant réflexion produit,
    no-code et intelligence artificielle.

  extended_description: >-
    Je pars d'un besoin, j'explore les solutions possibles,
    puis je construis une première version utilisable avec
    des outils d'IA et de no-code. Mon expérience en gestion
    de projet digital m'aide à cadrer, prioriser et mener
    un produit jusqu'à une version testable.

  signature:
    primary: "Comprendre. Construire. Tester. Améliorer."

  value_proposition:
    headline: "De l'idée à un produit testable."
    description: >-
      Je relie compréhension des besoins, prototypage
      no-code et IA pour transformer une idée
      en solution concrète.

  differentiators:
    - title: "Product mindset"
      description: >-
        Comprendre le problème et les utilisateurs
        avant de choisir une solution.

    - title: "Construction no-code et IA"
      description: >-
        Prototyper vite des interfaces, des fonctionnalités
        et des automatisations, en vérifiant les résultats.

    - title: "Pilotage de projet digital"
      description: >-
        Cadrer, planifier et coordonner un projet
        avec plusieurs interlocuteurs.

    - title: "Apprentissage en construisant"
      description: >-
        Tester, documenter et améliorer mes projets
        version après version.

  principles:
    - "Comprendre avant de construire."
    - "Faire simple avant de faire complexe."
    - "Tester plutôt que supposer."
    - "Documenter les décisions."
    - "Reconnaître mes limites."

